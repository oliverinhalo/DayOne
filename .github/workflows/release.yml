name: Release APK

# Push a tag (for example: git tag v2.0 && git push origin v2.0) and this builds the
# signed APK and publishes it as a GitHub Release you can download straight to the phone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Name the APK after the tag
        id: naming
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "DayOne-$TAG.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.naming.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "DayOne-$TAG.apk" --clobber
          else
            gh release create "$TAG" "DayOne-$TAG.apk" \
              --title "DayOne $TAG" \
              --notes-file CHANGELOG.md
          fi
