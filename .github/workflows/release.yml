name: Release APK

# Publishes a signed, installable APK as a GitHub Release. Three ways to fire it:
#   1. push a tag:            git tag v2.1 && git push origin v2.1
#   2. push any commit whose message contains [release] - the tag comes from
#      versionName in app/build.gradle.kts
#   3. run it by hand from the Actions tab
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0). Leave blank to use versionName."
        required: false

jobs:
  release:
    # A plain branch push shouldn't cut a release unless the commit asks for one.
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Work out the tag and name the APK after it
        id: naming
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "DayOne-$TAG.apk"
          ls -lh "DayOne-$TAG.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.naming.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "DayOne-$TAG.apk" --clobber
          else
            gh release create "$TAG" "DayOne-$TAG.apk" \
              --target "$GITHUB_SHA" \
              --title "DayOne $TAG" \
              --notes-file CHANGELOG.md
          fi
          echo "Published $TAG"
          gh release view "$TAG" --json assets --jq '.assets[].name'
